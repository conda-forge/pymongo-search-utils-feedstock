schema_version: 1

context:
  name: pymongo-search-utils
  version: "0.3.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/pymongo_search_utils/pymongo_search_utils-${{ version }}.tar.gz
  sha256: df59fcf3e2a7b2d84efc3f66f22da4a8cbb1a9419fd90616dddad5d69c9d341d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pymongo >=4.12.0

tests:
  - python:
      imports:
        - pymongo_search_utils
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: Utility library for working with vector search in MongoDB using PyMongo
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/mongodb-labs/pymongo-search-utils

extra:
  recipe-maintainers:
    - jan-janssen
